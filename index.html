<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- font Roboto - google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- main css -->
    <link rel="stylesheet" href="./css/main.css" />
    <title>Simple Portfolio - Hwang Tran</title>
  </head>
  <body>
    <!-- header section start -->
    <header class="header">
      <div class="container">
        <!-- navigation -->
        <nav class="navbar">
          <!-- logo -->
          <div class="navbar__logo">
            <img class="navbar__img" src="./images/logo.svg" alt="Li." />
          </div>

          <!-- link  -->
          <ul class="navbar__links">
            <li class="navbar__link">
              <a href="#work">Work</a>
            </li>
            <li class="navbar__link">
              <a href="#about">About</a>
            </li>
            <li class="navbar__link">
              <a href="#resume">Résume</a>
            </li>
            <a href="#!">
              <button class="navbar__btn">Contact</button>
            </a>
          </ul>

          <!-- ☰ button menu -->
          <div class="navbar__icons">
            <div class="navbar__icon"></div>
          </div>
        </nav>
      </div>
    </header>
    <!-- header section end -->

    <!-- banner section start -->
    <section id="banner">
      <div class="container">
        <!-- img -->
        <div class="banner__img">
          <img src="./images/banner-img.png" alt="Hello, I'm Lisa" />
        </div>
        <!-- heading -->
        <div class="banner__heading">
          <h1>Hello, I'm Lisa</h1>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Odio cumque
            officia ab autem, corporis quisquam unde? Placeat nam quas rerum.
          </p>
          <a href="#!">
            <button class="banner__btn">View More</button>
          </a>
          <div class="banner__social">
            <a href="#!">
              <i class="fa-brands fa-dribbble"></i>
            </a>
            <a href="#!">
              <i class="fa-brands fa-behance"></i>
            </a>
            <a href="#!">
              <i class="fa-brands fa-linkedin"></i>
            </a>
          </div>
        </div>
      </div>
    </section>
    <!-- banner section end -->

    <!-- font awesome -->
    <script
      src="https://kit.fontawesome.com/45f7d79fc2.js"
      crossorigin="anonymous"
    ></script>
    <!-- main js -->
    <script src="./js/main.js"></script>
  </body>
</html>
